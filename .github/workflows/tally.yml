name: Build Tally (compiler app)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tally/**"
      - ".github/workflows/tally.yml"

permissions:
  contents: write

concurrency:
  group: tally-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships an Android SDK. Accept licences and make sure platform 37 and build-tools 37 are there.
      - name: Prepare Android SDK
        continue-on-error: true
        run: |
          {
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "SDK=$SDK  java=$(java -version 2>&1 | head -1)"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            ls "$SM" || true
            yes | "$SM" --licenses > /dev/null || yes | sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SM" --licenses > /dev/null || true
            "$SM" "platforms;android-37" "build-tools;37.0.0" || sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SM" "platforms;android-37" "build-tools;37.0.0" || echo "sdkmanager could not install them, Gradle will try on its own"
            echo "--- installed:"; ls "$SDK/platforms" "$SDK/build-tools" || true
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          } 2>&1 | tee sdk.log

      - name: Build Tally (optimized)
        working-directory: tally
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # The smoke test (job below) installs exactly this file on an emulator.
      - name: Keep the APK for the smoke test
        uses: actions/upload-artifact@v4
        with:
          name: tally-apk
          path: tally/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Publish the APK as a release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find tally/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk: $apk"; ls -l "$apk"
          cp "$apk" Tally.apk
          assets="Tally.apk"
          if [ -f tally/app/build/outputs/mapping/release/mapping.txt ]; then cp tally/app/build/outputs/mapping/release/mapping.txt mapping.txt; assets="Tally.apk mapping.txt"; fi
          gh release delete latest --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create latest $assets --repo "${{ github.repository }}" --target "$GITHUB_SHA" --prerelease \
            --title "Tally (compiler app)" --notes "Built from commit ${GITHUB_SHA::7}. Signed with the fixed project key, so it installs over the previous build. mapping.txt only decodes crash traces."

      - name: Show errors on the run page
        if: always()
        run: |
          {
            echo "### Errors"
            echo '```'
            cat sdk.log build.log 2>/dev/null | grep -E '^e: |^FAILURE|What went wrong|error:|failed|Failed' | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the logs to branch build-logs
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/build.log 2>/dev/null || echo "no build log was produced (build step did not run)" > /tmp/out/build.log
          cp sdk.log /tmp/out/sdk.log 2>/dev/null || echo "no sdk log" > /tmp/out/sdk.log
          { cat /tmp/out/sdk.log /tmp/out/build.log | grep -E '^e: |What went wrong|error:|FAILURE|failed|Failed' | head -80 || true; } > /tmp/out/errors.txt
          [ -s /tmp/out/errors.txt ] || echo "no errors found" > /tmp/out/errors.txt
          echo "run $GITHUB_RUN_ID, commit $GITHUB_SHA" > /tmp/out/run.txt
          cd /tmp/out
          git init -q -b build-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "logs for run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs

  # Boots Android 14 in CI, installs the APK, opens it, taps through the tabs and starts its service. An emulator is not a Samsung phone.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tally-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: timeout 900 bash tools/ci/smoke-tally.sh apk/app-release.apk com.killswitch.tally

      - name: Show the result on the run page
        if: always()
        run: |
          {
            echo "### Smoke test"
            echo '```'
            cat ring-result.txt 2>/dev/null || echo "the smoke test did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the smoke result to branch build-logs
        if: always()
        run: |
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch build-logs "$URL" /tmp/bl || { mkdir -p /tmp/bl; git -C /tmp/bl init -q -b build-logs; }
          cp ring-result.txt /tmp/bl/ 2>/dev/null || echo "the smoke test did not run" > /tmp/bl/ring-result.txt
          cp smoke-test.log /tmp/bl/ 2>/dev/null || true
          rm -rf /tmp/bl/smoke; mkdir -p /tmp/bl/smoke; cp smoke/*.png /tmp/bl/smoke/ 2>/dev/null || true
          cd /tmp/bl
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -qm "smoke result for run $GITHUB_RUN_ID" || true
          git push -f "$URL" HEAD:build-logs
